name: my_money
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.10.8

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    flutter_svg: ^2.0.10+1
    flutter_secure_storage: ^10.0.0
    dio: ^5.9.2
    top_snackbar_flutter: ^3.3.0
    image_picker: ^1.2.1
    intl: ^0.20.2
    flutter_appauth: ^12.0.1
    flutter_dotenv: ^5.2.1

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4
    flutter_native_splash: ^2.4.7

flutter:
    uses-material-design: true

    assets:
        - lib/assets/images/logo.svg
        - lib/assets/images/icone.png
        - .env

flutter_launcher_icons:
    android: "launcher_icon"
    ios: true
    image_path: "lib/assets/images/icone.png"

flutter_native_splash:
    color: "#202024"
    image: "lib/assets/images/icone.png"
    android: true
    ios: true
